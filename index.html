","Aynı kişidir"],1,"A ve C, B ile kardeş olduklarından aynı kardeş grubundadır."],["Mantık","Bir odada yalnız üç sandalye vardır ve her sandalyede bir kişi oturuyor. Odada kaç oturan kişi vardır?",["1","2","3","4"],2,"Üç sandalyenin her biri doluysa üç kişi oturuyordur."],["Mantık","Saat 14.00'ten bir saat sonra saat kaç olur?",["13.00","14.30","16.00","15.00"],3,"14.00'a bir saat eklenince 15.00 olur."],["Mantık","Tüm kareler dörtgendir. Şekil bir karedir. Hangisi doğrudur?",["Şekil dörtgendir","Şekil dairedir","Şekil üçgendir","Hiçbiri"],0,"Kareler dörtgenlerin özel bir türüdür."],["Mantık","Mert, Selin'den önce; Selin, Duru'dan önce geldiyse ortadaki kişi kimdir?",["Mert","Selin","Duru","Bilinemez"],1,"Sıra Mert, Selin, Duru olduğundan ortada Selin vardır."],["Mantık","Bir anahtar yalnız A veya B kapısından birini açıyor. A'yı açmadığı biliniyorsa hangisini açar?",["İkisini de","Hiçbirini","B'yi","Bilinemez"],2,"Yalnız iki seçenek verildiği için A değilse B'dir."],["Mantık","Bir hafta 7 günse iki hafta kaç gündür?",["7","10","12","14"],3,"İki hafta 14 gündür."],["Mantık","Bir masanın dört köşesi vardır. Bir köşesi kesilirse geometrik olarak köşe sayısı genellikle kaç olur?",["5","3","4","6"],0,"Bir köşe kesilince eski köşe gider, kesimin iki ucunda iki yeni köşe oluşur: toplam 5."],["Mantık","Kuzeye bakan biri sağa dönerse hangi yöne bakar?",["Batı","Doğu","Güney","Kuzey"],1,"Kuzeyden sağa dönüş doğu yönüne getirir."],["Mantık","Bir yarışta ikinci sıradaki kişiyi geçersen kaçıncı olursun?",["Birinci","Üçüncü","İkinci","Dördüncü"],2,"İkinciyi geçince onun yerini alır ve ikinci olursun."],["Mantık","Dün pazar idiyse bugün hangi gündür?",["Cumartesi","Salı","Çarşamba","Pazartesi"],3,"Pazarın ertesi Pazartesidir."],["Mantık","Bir kutudaki bütün kalemler mavidir. Bu kutudan alınan bir kalem için ne söylenebilir?",["Mavidir","Kesin kırmızıdır","Kalem değildir","Rengi bilinemez"],0,"Tüm kalemlerin mavi olduğu verildiğine göre seçilen kalem de mavidir."],["Mantık","Elif, Zeynep'ten genç; Zeynep, Ada'dan gençtir. En yaşlı kimdir?",["Elif","Ada","Zeynep","Bilinemez"],1,"Yaş sırası Ada > Zeynep > Elif'tir."],["Mantık","Bir kapı ya açık ya kapalıdır. Açık olmadığı biliniyorsa hangi durumdadır?",["Kilitli olduğu kesin","Kırık","Kapalı","Yok"],2,"Verilen iki durumdan açık değilse kapalıdır."],["Mantık","Saat 09.30'dan 30 dakika sonra saat kaçtır?",["09.45","10.30","11.00","10.00"],3,"09.30'a 30 dakika eklenince 10.00 olur."],["Mantık","Üç arkadaşın boy sırası Kaan > Bora > Emre ise en kısa kimdir?",["Emre","Bora","Kaan","Bilinemez"],0,"Sıralamada en sonda Emre vardır."],["Mantık","Bir sayı hem 2'ye hem 3'e tam bölünüyorsa aşağıdakilerden hangisine kesin bölünür?",["4","6","9","12"],1,"2 ve 3 aralarında asal olduğundan sayı 6'ya bölünür."],["Mantık","Bir otobüste yalnız sürücü ve 5 yolcu varsa toplam kaç kişi vardır?",["5","7","6","4"],2,"Sürücü de kişi olduğundan toplam 6 kişi vardır."],["Mantık","Bir yıl 12 aysa yarım yıl kaç aydır?",["3","4","5","6"],3,"12 ayın yarısı 6 aydır."],["Mantık","Bir kitaplığın üst rafı orta rafın, orta raf da alt rafın üzerindedir. En aşağıda hangisi vardır?",["Alt raf","Orta raf","Üst raf","Bilinemez"],0,"Verilen sıralamada en aşağıda alt raf bulunur."],["Mantık","Bir kelimenin tüm harfleri büyük yazılmışsa aşağıdakilerden hangisi kesin söylenebilir?",["Kelime özel addır","Harfleri büyük yazılmıştır","Kelime İngilizcedir","Kelime kısaltmadır"],1,"Verilen tek kesin bilgi harflerin büyük yazılmış olmasıdır."]];
const CYCLE=15000,REVEAL=10000,KEY="okulQuizBalancedV5";
const categories=[...new Set(Q.map(x=>x[0]))];
const byCat=Object.fromEntries(categories.map(c=>[c,Q.map((x,i)=>x[0]===c?i:-1).filter(i=>i>=0)]));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){return{pools:Object.fromEntries(categories.map(c=>[c,shuffle(byCat[c])])),roundCats:shuffle(categories),catPos:0,current:null,cycleStart:Date.now()}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.pools&&s.roundCats&&Number.isFinite(s.cycleStart))return s}catch(e){}return fresh()}
let S=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function next(){
 if(S.catPos>=S.roundCats.length){S.roundCats=shuffle(categories);S.catPos=0}
 const c=S.roundCats[S.catPos++];
 if(!S.pools[c]||!S.pools[c].length)S.pools[c]=shuffle(byCat[c]);
 S.current=S.pools[c].pop();save()
}
const E=id=>document.getElementById(id),cat=E("cat"),qe=E("q"),ae=E("answers"),ex=E("exp"),st=E("status"),bar=E("bar");
function sync(){
 const now=Date.now();if(S.current==null){S.cycleStart=now;next()}
 let elapsed=now-S.cycleStart;if(elapsed<0){S.cycleStart=now;elapsed=0}
 if(elapsed>=CYCLE){const steps=Math.floor(elapsed/CYCLE);for(let i=0;i<steps;i++)next();S.cycleStart+=steps*CYCLE;save();elapsed=now-S.cycleStart}
 render(elapsed)
}
function render(elapsed){
 const [c,q,o,a,e]=Q[S.current],rev=elapsed>=REVEAL;cat.textContent=c;qe.textContent=q;ae.innerHTML="";
 o.forEach((x,i)=>{const d=document.createElement("div");d.className="answer"+(rev?(i===a?" correct":" wrong"):"");const l=document.createElement("div");l.className="letter";l.textContent="ABCD"[i];const tx=document.createElement("div");tx.textContent=x;d.append(l,tx);ae.appendChild(d)});
 ex.textContent="💡 "+e;ex.classList.toggle("show",rev);
 st.textContent=rev?"Doğru cevap: "+("ABCD"[a])+" • Yeni soru "+Math.max(0,Math.ceil((CYCLE-elapsed)/1000))+" sn sonra":"Cevabı düşün • "+Math.max(0,Math.ceil((REVEAL-elapsed)/1000))+" sn";
 const p=rev?(elapsed-REVEAL)/(CYCLE-REVEAL):elapsed/REVEAL;bar.style.transform="scaleX("+Math.max(0,1-Math.min(1,p))+")"
}
sync();setInterval(sync,100);
</script></body></html>
