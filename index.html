let order=[],pos=0,current=null,cycleStart=0,timers=[];
function shuffle(){
  order=[...Array(Q.length).keys()];
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  pos=0;
}
function saveState(){try{localStorage.setItem('okulQuizStateV2',JSON.stringify({order,pos,cycleStart}))}catch(e){}}
function loadState(){
 try{const s=JSON.parse(localStorage.getItem('okulQuizStateV2'));
  if(s&&Array.isArray(s.order)&&s.order.length===Q.length&&Number.isInteger(s.pos)&&Number.isFinite(s.cycleStart)){order=s.order;pos=s.pos;cycleStart=s.cycleStart;return true}
 }catch(e){} return false;
}
function advanceOne(){if(!order.length||pos>=order.length)shuffle();current=Q[order[pos++]]}
function syncToClock(){
 const now=Date.now();
 if(!loadState()){shuffle();cycleStart=now;advanceOne();saveState();return}
 if(pos===0){advanceOne()} else current=Q[order[pos-1]];
 let passed=Math.floor((now-cycleStart)/CYCLE);
 if(passed>0){for(let i=0;i<passed;i++)advanceOne();cycleStart+=passed*CYCLE;saveState()}
 if(now<cycleStart){cycleStart=now;saveState()}
}
function render(reveal){const [cat,q,opts,ans,exp]=current;category.textContent=cat;question.textContent=q;answers.innerHTML='';opts.forEach((x,i)=>{const d=document.createElement('div');d.className='answer'+(reveal?(i===ans?' correct':' dim'):'');d.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${x}</span>`;answers.appendChild(d)});explain.textContent=reveal?'💡 '+exp:'';explain.className='explain'+(reveal?' show':'');status.textContent=reveal?'✅ Doğru cevap: '+String.fromCharCode(65+ans):'Cevabı düşün 🤔'}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function setBarFraction(frac,ms){bar.style.transition='none';bar.style.transform=`scaleX(${Math.max(0,Math.min(1,frac))})`;requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition=`transform ${ms}ms linear`;bar.style.transform='scaleX(0)'}))}
function schedule(){
 clearTimers(); syncToClock(); const elapsed=Date.now()-cycleStart;
 if(elapsed<THINK){render(false);setBarFraction(1-elapsed/THINK,THINK-elapsed);timers.push(setTimeout(()=>{render(true);setBarFraction(1,Math.max(0,CYCLE-THINK))},THINK-elapsed));}
